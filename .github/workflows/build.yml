name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for the changelog

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build jar
        run: mvn -B package

      - name: Region scanner self-check
        run: java -Djava.awt.headless=true -cp target/classes:target/test-classes dev.chunkscan.RegionScannerCheck target/check-world target/check-out

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: ChunkScan-build-${{ github.run_number }}
          path: target/ChunkScan-*.jar
          if-no-files-found: error

      - name: Check whether this version is already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released. Bump the version in pom.xml to publish a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            # changelog: commit subjects since the previous release tag
            previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            range=${previous:+$previous..}HEAD
            git log --no-merges --format='- %s' "$range" > CHANGELOG.md
            echo "Changelog:" && cat CHANGELOG.md
          fi

      # Modrinth goes first: if it fails, no GitHub release exists yet and a re-run retries both.
      # Skipped until the repository variable MODRINTH_PROJECT_ID is set.
      - name: Publish to Modrinth
        if: steps.version.outputs.exists == 'false' && vars.MODRINTH_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_PAT }}
          files: target/ChunkScan-*.jar
          name: ChunkScan ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: |
            bukkit
            spigot
            paper
            purpur
          game-versions: '>=1.18'
          game-version-filter: releases
          java: |
            17
            21
          dependencies: |
            chunky(optional){modrinth:chunky}

      - name: Create GitHub release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ChunkScan ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: target/ChunkScan-*.jar
          fail_on_unmatched_files: true
          body_path: CHANGELOG.md
