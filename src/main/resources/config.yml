# Pause running Chunky tasks while a scan runs, so no region files change while they are read.
# They are continued when the scan is done.
pause-chunky: true

# Plugins that continue Chunky on their own (e.g. when the server is empty). If one of them is installed,
# a scan warns that it should be removed temporarily, because it could continue Chunky during the scan.
auto-continue-plugins:
  - ChunkyAutoPause

# Check GitHub for a newer ChunkScan release on startup and tell ops (chunkscan.use) when they join.
update-check: true
