# Pause Chunky while a scan runs, so no region files change while they are read.
# If another plugin (e.g. ChunkyAutoPause) continues Chunky during the scan, it is paused again within a second.
# Everything paused this way is continued when the scan is done.
pause-chunky: true

# Check GitHub for a newer ChunkScan release on startup and tell ops (chunkscan.use) when they join.
update-check: true
