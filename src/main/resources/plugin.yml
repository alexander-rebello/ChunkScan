name: ChunkScan
version: '${project.version}'
main: dev.chunkscan.ChunkScanPlugin
api-version: '1.17'
softdepend: [Chunky]
description: Reads InhabitedTime of all generated chunks and finds the smallest radius containing all visited chunks.
commands:
  chunkscan:
    description: Scan InhabitedTime of all chunks in a world.
    usage: /chunkscan [minTime] [chunky | spawn [world] | origin [world] | here | <x> <z> [world]] [--export] | /chunkscan version | /chunkscan optimize [world|cancel]
    permission: chunkscan.use
permissions:
  chunkscan.use:
    description: Allows running /chunkscan
    default: op
